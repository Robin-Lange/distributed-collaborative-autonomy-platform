name: Continuous Validation

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  rust-validation:
    name: Rust validation
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ \
            lld \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci-ubuntu-24-04

      - name: Build validator
        run: |
          mkdir -p target
          rustc validate.rs -O -o target/validate

      - name: Run quality checks
        run: ./target/validate --quality-checks-only

      - name: Run Rust tests
        run: ./target/validate --tests-only

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-validation-reports
          path: logs/validation-*.log
          if-no-files-found: ignore

  python-tests:
    name: Python sidecar tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python unit tests
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
