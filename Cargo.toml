[workspace]
default-members = ["apps/dca"]
members = [
    "apps/dca",
    "crates/agent",
    "crates/autonomy",
    "crates/contracts",
    "crates/middleware-zenoh",
    "observers/mcap-recorder",
    "observers/visualizer",
    "platforms/spot",
    "sensors/mocap",
    "simulation/avian",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-Proprietary"
repository = "https://git.ihmc.us/ncca/distributed-collaborative-autonomy-platform"

[workspace.dependencies]
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "parallel", "parry-f32"] }
bevy = "0.19.0"
chrono = "0.4.45"
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
futures = "0.3.30"
glam = "0.33.1"
mcap = "0.25.0"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
ratatui = "0.30.0"
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zenoh = { version = "1.9.0", default-features = false, features = ["transport_tcp", "transport_udp"] }

[profile.dev]
# Full DWARF debug info (the default) on this dep graph (bevy+zenoh+avian3d)
# makes the test binary's link step OOM on constrained CI runners
# (`ld terminated with signal 9`). Line tables keep panic backtraces useful
# without the full type/variable info that bloats the linker's memory use.
debug = "line-tables-only"

[profile.release]
# Release defaults to overflow-checks = false; keep them on so the shipped
# binary still panics on overflow instead of silently wrapping, without
# needing a second full `cargo test --release` run just to get that check.
overflow-checks = true

[patch.crates-io]
# Zenoh 1.9.0 pins an affected lz4_flex release even when transport
# compression is disabled. This local copy changes only that dependency.
zenoh-transport = { path = "third_party/zenoh-transport" }
# The released scanner remains API-compatible with the released Wayland stack;
# this local copy updates quick-xml and its corresponding parser call.
wayland-scanner = { path = "third_party/wayland-scanner" }
